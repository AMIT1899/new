<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | NORTHROW</title><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main><div id="successRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let id=StoreUtils.params().get('id')||StoreStorage.get(StoreStorage.KEYS.lastOrder,''),o=StoreStorage.get(StoreStorage.KEYS.orders,[]).find(x=>x.orderId===id),r=document.getElementById('successRoot');if(!o){r.innerHTML='<div class="empty-state"><h1>Order not found.</h1><a class="btn primary" href="orders.html">VIEW ORDERS</a></div>';return}let eta=new Date(o.createdAt);eta.setDate(eta.getDate()+6);r.innerHTML=`<div class="success-panel"><div class="success-mark">✓</div><p class="eyebrow">ORDER CONFIRMED</p><h1>Thank you, ${StoreUtils.escapeHTML(o.customer.fullName.split(' ')[0])}!</h1><p>Your order <strong>${o.orderId}</strong> has been confirmed.</p><div class="success-grid"><div><span>Payment</span><strong>${o.paymentMethod}</strong></div><div><span>Expected delivery</span><strong>By ${eta.toLocaleDateString('en-IN')}</strong></div><div><span>Ship to</span><strong>${StoreUtils.escapeHTML(o.shippingAddress.city)}, ${StoreUtils.escapeHTML(o.shippingAddress.state)}</strong></div><div><span>Total</span><strong>${StoreUtils.money(o.pricing.total)}</strong></div></div><div class="success-items">${o.items.map(i=>`<div><img src="${i.image}" alt=""><span>${StoreUtils.escapeHTML(i.name)}<small>Size ${i.size} · Qty ${i.quantity}</small></span><strong>${StoreUtils.money(i.price*i.quantity)}</strong></div>`).join('')}</div><div class="success-actions"><a class="btn primary" href="shop.html">CONTINUE SHOPPING</a><a class="btn secondary" href="orders.html">VIEW MY ORDERS</a></div></div>`});</script></body></html>
