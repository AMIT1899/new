<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | 3 STAR</title><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main><div id="successRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script src="js/patch.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const id=StoreUtils.params().get('id')||StoreStorage.get(StoreStorage.KEYS.lastOrder,''),o=StoreStorage.get(StoreStorage.KEYS.orders,[]).find(x=>x.orderId===id),r=document.getElementById('successRoot');if(!o){r.innerHTML='<div class="empty-state"><h1>Order not found</h1><a class="btn primary" href="orders.html">View Orders</a></div>';return}r.innerHTML=`<div class="success-panel"><div class="success-mark">✓</div><h1>Order Confirmed</h1><p>Thank you, ${StoreUtils.escapeHTML(o.customer.fullName)}.</p><p>Your order <strong>${o.orderId}</strong> has been confirmed.</p><div class="success-grid"><div><span>Payment</span><strong>${o.paymentMethod}</strong></div><div><span>Ship to</span><strong>${StoreUtils.escapeHTML(o.shippingAddress.city)}, ${StoreUtils.escapeHTML(o.shippingAddress.state)}</strong></div><div><span>Total</span><strong>${StoreUtils.money(o.pricing.total)}</strong></div></div><div class="success-actions"><a class="btn primary" href="shop.html">Continue Shopping</a><a class="btn secondary" href="orders.html">View My Orders</a></div></div>`});</script></body></html>
