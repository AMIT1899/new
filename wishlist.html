<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Wishlist | NORTHROW</title><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div id="wishlistRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const r=document.getElementById('wishlistRoot');function render(){let ids=StoreStorage.get(StoreStorage.KEYS.wishlist,[]),items=ids.map(StoreUtils.productById).filter(Boolean);r.innerHTML=items.length?`<div class="page-title-row"><h1>WISHLIST</h1><span>${items.length} SAVED</span></div><div class="product-grid four">${items.map(StoreUtils.productCard).join('')}</div>`:'<div class="empty-state"><h1>You haven’t saved anything yet.</h1><p>Tap the heart on any product to keep it here.</p><a class="btn primary" href="shop.html">EXPLORE PRODUCTS</a></div>';StoreApp.updateWishlistButtons()}document.addEventListener('click',e=>{if(e.target.closest('[data-wishlist]'))setTimeout(render)});render()});</script></body></html>
