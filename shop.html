<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop Men | NORTHROW</title><meta name="description" content="Browse men’s sportswear, casualwear and essentials with working filters and sorting."><link rel="icon" href="assets/images/brand/product-fallback.svg"><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div class="shop-top"><div><p class="eyebrow">NORTHROW / MEN</p><h1 id="collectionTitle">MEN’S COLLECTION</h1></div><div class="shop-controls"><button class="btn secondary filter-toggle" id="filterToggle">FILTER</button><select id="sortSelect" aria-label="Sort products"><option value="recommended">Recommended</option><option value="newest">Newest</option><option value="low">Price Low to High</option><option value="high">Price High to Low</option><option value="discount">Highest Discount</option></select></div></div><div class="page-title-row"><span id="resultCount">0 PRODUCTS</span></div><div class="shop-layout"><aside class="filter-bar" id="filterPanel"><h3>CATEGORY</h3><select id="categoryFilter"><option value="">All categories</option><option>Sports</option><option>Casual</option><option>Activewear</option><option>Basics</option><option>T-Shirts</option><option>Shirts</option><option>Polos</option><option>Jeans</option><option>Trousers</option><option>Joggers</option><option>Shorts</option><option>Hoodies</option><option>Jackets</option></select><h3>SIZE</h3><select id="sizeFilter"></select><h3>COLOUR</h3><select id="colourFilter"></select><h3>PRICE</h3><select id="priceFilter"><option value="all">All prices</option><option value="0-1000">Under ₹1,000</option><option value="1000-1500">₹1,000–₹1,500</option><option value="1500-2000">₹1,500–₹2,000</option><option value="2000-5000">₹2,000+</option></select><h3>FIT</h3><select id="fitFilter"></select><h3>STYLE</h3><select id="styleFilter"><option value="">All styles</option><option value="oversized">Oversized</option><option value="gym">Gym / Training</option><option value="smart casual">Smart Casual</option><option value="streetwear">Streetwear</option></select><h3>AVAILABILITY</h3><select id="availabilityFilter"><option value="">All</option><option value="instock">In stock</option><option value="limited">Limited stock</option></select><button class="link-btn" id="clearFilters">CLEAR FILTERS</button></aside><section class="product-grid shop-grid" id="shopGrid"></section></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const $=StoreUtils.qs,$$=StoreUtils.qsa,p=StoreUtils.params();let state={category:p.get('category')||'',q:p.get('q')||'',size:'',colour:'',price:'all',fit:'',style:'',availability:'',sort:'recommended'};if(p.get('new'))state.collection='new';if(p.get('best'))state.collection='best';if(p.get('sale'))state.collection='sale';const grid=$('#shopGrid'),count=$('#resultCount'),title=$('#collectionTitle'),filterPanel=$('#filterPanel'),colours=[...new Set(PRODUCTS.flatMap(x=>x.colours))],fits=[...new Set(PRODUCTS.map(x=>x.fit))],sizes=[...new Set(PRODUCTS.flatMap(x=>x.sizes.map(s=>s.size)))];$('#colourFilter').innerHTML='<option value="">All colours</option>'+colours.map(v=>`<option>${v}</option>`).join('');$('#fitFilter').innerHTML='<option value="">All fits</option>'+fits.map(v=>`<option>${v}</option>`).join('');$('#sizeFilter').innerHTML='<option value="">All sizes</option>'+sizes.map(v=>`<option>${v}</option>`).join('');if(state.category)$('#categoryFilter').value=state.category;title.textContent=state.q?`SEARCH: “${state.q.toUpperCase()}”`:state.category?state.category.toUpperCase():state.collection==='new'?'NEW ARRIVALS':state.collection==='best'?'BEST SELLERS':state.collection==='sale'?'SALE':'MEN’S COLLECTION';function filtered(){let a=[...PRODUCTS];if(state.category)a=a.filter(x=>x.category===state.category||x.subcategory===state.category);if(state.q){let q=state.q.toLowerCase();a=a.filter(x=>[x.name,x.category,x.subcategory,x.description,x.colours.join(' '),x.tags.join(' ')].join(' ').toLowerCase().includes(q))}if(state.collection==='new')a=a.filter(x=>x.newArrival);if(state.collection==='best')a=a.filter(x=>x.bestseller);if(state.collection==='sale')a=a.filter(x=>x.mrp>x.price);if(state.size)a=a.filter(x=>x.sizes.some(s=>s.size===state.size&&s.stock>0));if(state.colour)a=a.filter(x=>x.colours.includes(state.colour));if(state.fit)a=a.filter(x=>x.fit===state.fit);if(state.style)a=a.filter(x=>[x.fit,x.subcategory,...x.tags].join(' ').toLowerCase().includes(state.style));if(state.availability==='instock')a=a.filter(x=>x.sizes.some(s=>s.stock>0));if(state.availability==='limited')a=a.filter(x=>x.sizes.reduce((n,s)=>n+s.stock,0)<=12);if(state.price!=='all'){let[lo,hi]=state.price.split('-').map(Number);a=a.filter(x=>x.price>=lo&&x.price<=hi)}if(state.sort==='low')a.sort((x,y)=>x.price-y.price);if(state.sort==='high')a.sort((x,y)=>y.price-x.price);if(state.sort==='discount')a.sort((x,y)=>StoreUtils.discountPercent(y)-StoreUtils.discountPercent(x));if(state.sort==='newest')a.sort((x,y)=>y.createdIndex-x.createdIndex);if(state.sort==='recommended')a.sort((x,y)=>(+y.featured + +y.bestseller)-(+x.featured + +x.bestseller));return a}function render(){let a=filtered();count.textContent=`${a.length} PRODUCTS`;grid.innerHTML=a.length?a.map(StoreUtils.productCard).join(''):'<div class="empty-state wide"><h2>No products found</h2><p>Try removing a filter or searching for a broader term.</p><a class="btn secondary" href="shop.html">RESET SHOP</a></div>';StoreApp.updateWishlistButtons()}[['categoryFilter','category'],['sizeFilter','size'],['colourFilter','colour'],['priceFilter','price'],['fitFilter','fit'],['styleFilter','style'],['availabilityFilter','availability'],['sortSelect','sort']].forEach(([id,key])=>$('#'+id).addEventListener('change',e=>{state[key]=e.target.value;render()}));$('#clearFilters').onclick=()=>{location.href='shop.html'};$('#filterToggle').onclick=()=>filterPanel.classList.toggle('open');render()});</script></body></html>
