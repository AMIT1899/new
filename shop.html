<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shop | NORTHROW</title><meta name="description" content="Browse men's clothing by category."><link rel="icon" href="assets/images/brand/product-fallback.svg"><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div class="shop-top"><div><p class="eyebrow">OUR PRODUCTS</p><h1 id="collectionTitle">Men's Collection</h1></div><div class="category-filter-box"><label for="categoryFilter">Category:</label><select id="categoryFilter"><option value="">All Products</option><option value="T-Shirts">T-Shirts</option><option value="Shirts">Shirts</option><option value="Polos">Polos</option><option value="Jeans">Jeans</option><option value="Trousers">Trousers</option><option value="Joggers">Joggers</option><option value="Shorts">Shorts</option><option value="Hoodies">Hoodies</option><option value="Jackets">Jackets</option><option value="Sports">Sports</option><option value="Casual">Casual</option><option value="Basics">Basics</option></select></div></div><div class="page-title-row"><span id="resultCount">0 PRODUCTS</span></div><section class="product-grid shop-grid" id="shopGrid"></section></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const p=StoreUtils.params();let category=p.get('category')||'',q=p.get('q')||'',collection=p.get('new')?'new':p.get('best')?'best':p.get('sale')?'sale':'';const filter=document.getElementById('categoryFilter'),grid=document.getElementById('shopGrid'),count=document.getElementById('resultCount'),title=document.getElementById('collectionTitle');if(category)filter.value=category;function getProducts(){let a=[...PRODUCTS];if(category)a=a.filter(x=>x.category===category||x.subcategory===category);if(q){const s=q.toLowerCase();a=a.filter(x=>[x.name,x.category,x.subcategory,x.tags.join(' ')].join(' ').toLowerCase().includes(s))}if(collection==='new')a=a.filter(x=>x.newArrival);if(collection==='best')a=a.filter(x=>x.bestseller);if(collection==='sale')a=a.filter(x=>x.mrp>x.price);return a}function render(){const a=getProducts();title.textContent=q?`Search: ${q}`:category||'Men\'s Collection';count.textContent=`${a.length} PRODUCTS`;grid.innerHTML=a.length?a.map(StoreUtils.productCard).join(''):'<div class="empty-state"><h2>No products found</h2><p>Try another category.</p><a class="btn" href="shop.html">Show All Products</a></div>';StoreApp.updateWishlistButtons()}filter.addEventListener('change',e=>{category=e.target.value;history.replaceState(null,'',category?`shop.html?category=${encodeURIComponent(category)}`:'shop.html');render()});render()});</script></body></html>
