<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Product | NORTHROW</title><meta name="description" content="View product details, sizes, pricing, delivery and add items to bag."><link rel="icon" href="assets/images/brand/product-fallback.svg"><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="product-page"><div id="productRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const $=StoreUtils.qs,id=StoreUtils.params().get('id')||StoreUtils.params().get('slug'),p=StoreUtils.productById(id),root=$('#productRoot');if(!p){root.innerHTML='<div class="empty-state"><h1>Product not found</h1><a class="btn" href="shop.html">BACK TO SHOP</a></div>';return}let selectedSize=null,selectedColour=p.colours[0],qty=1,active=p.images[0],recent=StoreStorage.get(StoreStorage.KEYS.recent,[]).filter(x=>x!==p.id);recent.unshift(p.id);StoreStorage.set(StoreStorage.KEYS.recent,recent.slice(0,8));function render(){let display=selectedSize?selectedSize.price:p.price;root.innerHTML=`<div class="product-layout"><div class="product-gallery"><div class="thumbs">${p.images.map(src=>`<button class="thumb ${src===active?'active':''}" data-img="${src}"><img src="${src}" alt=""></button>`).join('')}</div><div class="main-image"><img src="${active}" alt="${StoreUtils.escapeHTML(p.name)}"></div></div><div class="product-meta"><p class="eyebrow">${p.category} / ${p.subcategory}</p><h1>${StoreUtils.escapeHTML(p.name)}</h1><div class="rating">★ ${p.rating} · ${p.reviews} reviews</div><div class="product-price"><strong>${StoreUtils.money(display)}</strong><del>${StoreUtils.money(p.mrp)}</del><span>${StoreUtils.discountPercent({...p,price:display})}% OFF</span></div><p>MRP inclusive of all taxes</p><div class="choice-title">COLOUR · ${selectedColour}</div><div class="swatches">${p.colours.map(c=>`<button data-colour="${c}" class="swatch ${c===selectedColour?'active':''}">${c}</button>`).join('')}</div><div class="choice-title">SELECT SIZE · <a href="size-guide.html">SIZE GUIDE</a></div><div class="sizes">${p.sizes.map(s=>`<button data-size="${s.size}" ${s.stock<=0?'disabled':''} class="size-btn ${selectedSize?.size===s.size?'active':''}">${s.size}</button>`).join('')}</div><div id="sizeError" class="field-error"></div><div class="qty-row"><span>QTY</span><button data-qty="-">−</button><strong>${qty}</strong><button data-qty="+">+</button></div><div class="action-row"><button id="addCart" class="btn primary">ADD TO BAG</button><button id="buyNow" class="btn secondary">BUY NOW</button></div><button class="btn full" data-wishlist="${p.id}">♡ SAVE TO WISHLIST</button><div class="delivery-box"><strong>DELIVERY</strong><div class="pincode-row"><input id="pincode" inputmode="numeric" maxlength="6" placeholder="Enter PIN code"><button id="pinCheck">CHECK</button></div><p id="pinResult"></p></div><div class="details-accordion"><details open><summary>PRODUCT DETAILS</summary><p>${StoreUtils.escapeHTML(p.description)}</p><p><strong>Material:</strong> ${p.material}<br><strong>Fit:</strong> ${p.fit}<br><strong>Care:</strong> ${p.care}</p></details><details><summary>DELIVERY & RETURNS</summary><p>Free shipping above ₹1,499. Easy returns within 7 days on eligible unworn items. COD available.</p></details></div></div></div><section class="related section-pad"><div class="section-head"><h2>YOU MAY ALSO LIKE</h2></div><div class="product-grid four" id="relatedGrid"></div></section>`;bind();$('#relatedGrid').innerHTML=PRODUCTS.filter(x=>x.id!==p.id&&(x.category===p.category||x.tags.some(t=>p.tags.includes(t)))).slice(0,4).map(StoreUtils.productCard).join('');StoreApp.updateWishlistButtons()}function item(){if(!selectedSize){$('#sizeError').textContent='Please select an available size.';return null}return{productId:p.id,name:p.name,size:selectedSize.size,colour:selectedColour,price:selectedSize.price,quantity:qty,image:p.images[0]}}function add(it){let cart=StoreStorage.get(StoreStorage.KEYS.cart,[]),key=StoreUtils.itemKey(it),f=cart.find(x=>StoreUtils.itemKey(x)===key);if(f)f.quantity+=it.quantity;else cart.push(it);StoreStorage.set(StoreStorage.KEYS.cart,cart);StoreApp.updateCartCount();StoreApp.notify('Added to bag')}function bind(){StoreUtils.qsa('[data-img]').forEach(b=>b.onclick=()=>{active=b.dataset.img;render()});StoreUtils.qsa('[data-size]').forEach(b=>b.onclick=()=>{selectedSize=p.sizes.find(s=>s.size===b.dataset.size);render()});StoreUtils.qsa('[data-colour]').forEach(b=>b.onclick=()=>{selectedColour=b.dataset.colour;render()});StoreUtils.qsa('[data-qty]').forEach(b=>b.onclick=()=>{qty=Math.max(1,Math.min(8,qty+(b.dataset.qty==='+'?1:-1)));render()});$('#addCart').onclick=()=>{let it=item();if(it)add(it)};$('#buyNow').onclick=()=>{let it=item();if(it){StoreStorage.set(StoreStorage.KEYS.buyNow,[it]);location.href='checkout.html?mode=buy-now'}};$('#pinCheck').onclick=()=>{$('#pinResult').innerHTML=/^[1-9][0-9]{5}$/.test($('#pincode').value.trim())?'<span class="success-text">Delivery available · 3–7 business days · COD available</span>':'<span class="error-text">Enter a valid 6-digit Indian PIN code.</span>'}}render()});</script></body></html>
