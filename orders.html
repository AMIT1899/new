<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Orders | 3 STAR</title><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div id="ordersRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script src="js/patch.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const r=document.getElementById('ordersRoot'),a=StoreStorage.get(StoreStorage.KEYS.orders,[]);if(!a.length){r.innerHTML='<div class="empty-state"><h1>No orders yet</h1><a class="btn primary" href="shop.html">Start Shopping</a></div>';return}r.innerHTML=`<div class="page-title-row"><h1>My Orders</h1></div><div class="orders-list">${a.map(o=>`<article class="order-card"><div class="order-head"><div><strong>${o.orderId}</strong><span>${new Date(o.createdAt).toLocaleDateString('en-IN')}</span></div><span class="status">${o.status}</span></div><div class="order-products">${o.items.map(i=>`<div><img src="${i.image}" alt=""><span>${StoreUtils.escapeHTML(i.name)}<small>Size ${i.size} · Qty ${i.quantity}</small></span></div>`).join('')}</div><div class="order-foot"><span>${o.paymentMethod}</span><strong>${StoreUtils.money(o.pricing.total)}</strong></div></article>`).join('')}</div>`});</script></body></html>
