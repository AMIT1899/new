<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Cart | 3 STAR</title><meta name="description" content="Shopping cart"><link rel="icon" href="assets/images/brand/product-fallback.svg"><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div id="cartRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script src="js/patch.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const root=document.getElementById('cartRoot');function cart(){return StoreStorage.get(StoreStorage.KEYS.cart,[])}function save(c){StoreStorage.set(StoreStorage.KEYS.cart,c);StoreApp.updateCartCount();render()}function render(){const c=cart();if(!c.length){root.innerHTML='<div class="empty-state"><h1>Your cart is empty</h1><p>Add some products from the shop.</p><a class="btn primary" href="shop.html">Go to Shop</a></div>';return}const t=StoreUtils.totals(c);root.innerHTML=`<div class="cart-layout"><section><div class="page-title-row"><h1>Shopping Cart</h1><span>${c.reduce((s,i)=>s+i.quantity,0)} items</span></div><div class="cart-items">${c.map((i,idx)=>`<article class="cart-item"><img src="${i.image}" alt="${StoreUtils.escapeHTML(i.name)}" onerror="StoreUtils.imageFallback(this)"><div><a href="product.html?id=${i.productId}" class="cart-name"><strong>${StoreUtils.escapeHTML(i.name)}</strong></a><p>Size ${i.size} · ${i.colour}</p><div class="cart-qty"><button data-dec="${idx}">−</button><span>${i.quantity}</span><button data-inc="${idx}">+</button></div><button class="link-btn" data-remove="${idx}">Remove</button></div><strong>${StoreUtils.money(i.price*i.quantity)}</strong></article>`).join('')}</div></section><aside class="summary-card"><h2>Order Summary</h2><div class="summary-lines"><div><span>Subtotal</span><span>${StoreUtils.money(t.subtotal)}</span></div><div><span>Shipping</span><span>${StoreUtils.money(t.shipping)}</span></div><div class="summary-total"><span>Total</span><span>${StoreUtils.money(t.total)}</span></div></div><a class="btn primary full" href="checkout.html">Proceed to Checkout</a></aside></div>`;StoreUtils.qsa('[data-inc]').forEach(b=>b.onclick=()=>{let x=cart();x[+b.dataset.inc].quantity++;save(x)});StoreUtils.qsa('[data-dec]').forEach(b=>b.onclick=()=>{let x=cart(),i=+b.dataset.dec;x[i].quantity--;if(x[i].quantity<1)x.splice(i,1);save(x)});StoreUtils.qsa('[data-remove]').forEach(b=>b.onclick=()=>{let x=cart();x.splice(+b.dataset.remove,1);save(x)})}render()});</script></body></html>
