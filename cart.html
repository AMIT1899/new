<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shopping Bag | NORTHROW</title><meta name="description" content="Shopping Bag"><link rel="icon" href="assets/images/brand/product-fallback.svg"><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div id="cartRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const $=StoreUtils.qs;let coupon=StoreStorage.get(StoreStorage.KEYS.coupon,'')||'';const root=$('#cartRoot');function cart(){return StoreStorage.get(StoreStorage.KEYS.cart,[])}function save(c){StoreStorage.set(StoreStorage.KEYS.cart,c);StoreApp.updateCartCount();render()}function render(){const c=cart();if(!c.length){root.innerHTML='<div class="empty-state"><h1>Your bag is empty.</h1><p>Build your rotation from the latest drop.</p><a class="btn primary" href="shop.html">SHOP MEN</a></div>';return}const t=StoreUtils.totals(c,coupon);root.innerHTML=`<div class="cart-layout"><section><div class="page-title-row"><h1>SHOPPING BAG</h1><span>${c.reduce((s,i)=>s+i.quantity,0)} ITEMS</span></div><div class="cart-items">${c.map((i,idx)=>`<article class="cart-item"><img src="${i.image}" alt="${StoreUtils.escapeHTML(i.name)}"><div><a href="product.html?id=${i.productId}" class="cart-name">${StoreUtils.escapeHTML(i.name)}</a><p>Size ${i.size} · ${i.colour}</p><div class="cart-qty"><button data-dec="${idx}">−</button><span>${i.quantity}</span><button data-inc="${idx}">+</button></div><button class="link-btn" data-remove="${idx}">REMOVE</button></div><strong>${StoreUtils.money(i.price*i.quantity)}</strong></article>`).join('')}</div></section><aside class="summary-card"><h2>ORDER SUMMARY</h2><div class="coupon-row"><input id="couponInput" placeholder="Coupon code" value="${coupon}"><button id="applyCoupon">APPLY</button></div><p class="coupon-message ${t.coupon.valid?'ok':'bad'}">${coupon?t.coupon.message:'Try FIRST10, SPORT15 or SAVE200'}</p><div class="summary-lines"><div><span>Subtotal</span><span>${StoreUtils.money(t.subtotal)}</span></div><div><span>Discount</span><span>${t.discount?'-'+StoreUtils.money(t.discount):StoreUtils.money(0)}</span></div><div><span>Shipping</span><span>${t.shipping?StoreUtils.money(t.shipping):'FREE'}</span></div><div class="summary-total"><span>TOTAL</span><span>${StoreUtils.money(t.total)}</span></div></div><a class="btn primary full" href="checkout.html">PROCEED TO CHECKOUT</a><p>COD available. Free shipping above ₹1,499 after discounts.</p></aside></div>`;StoreUtils.qsa('[data-inc]').forEach(b=>b.onclick=()=>{let x=cart();x[+b.dataset.inc].quantity++;save(x)});StoreUtils.qsa('[data-dec]').forEach(b=>b.onclick=()=>{let x=cart(),i=+b.dataset.dec;x[i].quantity--;if(x[i].quantity<1)x.splice(i,1);save(x)});StoreUtils.qsa('[data-remove]').forEach(b=>b.onclick=()=>{let x=cart();x.splice(+b.dataset.remove,1);save(x)});$('#applyCoupon').onclick=()=>{coupon=$('#couponInput').value.trim().toUpperCase();let r=StoreUtils.applyCoupon(cart(),coupon);if(r.valid)StoreStorage.set(StoreStorage.KEYS.coupon,coupon);else StoreStorage.remove(StoreStorage.KEYS.coupon);render()}}render()});</script></body></html>
