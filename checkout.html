<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Checkout | NORTHROW</title><meta name="description" content="Checkout"><link rel="icon" href="assets/images/brand/product-fallback.svg"><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div id="checkoutRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const $=StoreUtils.qs,buyNow=StoreUtils.params().get('mode')==='buy-now',items=buyNow?StoreStorage.get(StoreStorage.KEYS.buyNow,[]):StoreStorage.get(StoreStorage.KEYS.cart,[]),coupon=buyNow?'':(StoreStorage.get(StoreStorage.KEYS.coupon,'')||''),root=$('#checkoutRoot');if(!items.length){root.innerHTML='<div class="empty-state"><h1>Nothing to checkout.</h1><a class="btn primary" href="shop.html">SHOP MEN</a></div>';return}const saved=StoreStorage.get(StoreStorage.KEYS.customer,{})||{},t=StoreUtils.totals(items,coupon);root.innerHTML=`<div class="checkout-layout"><section><div class="page-title-row"><h1>CHECKOUT</h1><span>COD CHECKOUT</span></div><form id="checkoutForm" novalidate><div class="checkout-section"><span class="step-no">01</span><h2>CONTACT DETAILS</h2><div class="form-grid"><label>Full Name<input name="fullName" value="${StoreUtils.escapeHTML(saved.fullName||'')}"><span class="field-error"></span></label><label>Mobile Number<input name="mobile" inputmode="numeric" maxlength="10" value="${StoreUtils.escapeHTML(saved.mobile||'')}"><span class="field-error"></span></label><label class="wide">Email<input name="email" type="email" value="${StoreUtils.escapeHTML(saved.email||'')}"><span class="field-error"></span></label></div></div><div class="checkout-section"><span class="step-no">02</span><h2>SHIPPING ADDRESS</h2><div class="form-grid"><label class="wide">Address Line 1<input name="address1" value="${StoreUtils.escapeHTML(saved.address1||'')}"><span class="field-error"></span></label><label class="wide">Address Line 2<input name="address2" value="${StoreUtils.escapeHTML(saved.address2||'')}"></label><label>Landmark<input name="landmark" value="${StoreUtils.escapeHTML(saved.landmark||'')}"></label><label>City<input name="city" value="${StoreUtils.escapeHTML(saved.city||'')}"><span class="field-error"></span></label><label>State<input name="state" value="${StoreUtils.escapeHTML(saved.state||'')}"><span class="field-error"></span></label><label>PIN Code<input name="pincode" inputmode="numeric" maxlength="6" value="${StoreUtils.escapeHTML(saved.pincode||'')}"><span class="field-error"></span></label><label>Country<input name="country" value="India" readonly></label></div></div><div class="checkout-section"><span class="step-no">03</span><h2>PAYMENT</h2><label class="payment-choice"><input type="radio" name="payment" value="COD" checked><span><strong>Cash on Delivery (COD)</strong><small>Pay when your order arrives.</small></span></label><label class="payment-choice disabled"><input type="radio" disabled><span><strong>UPI</strong><small>Coming soon</small></span></label><label class="payment-choice disabled"><input type="radio" disabled><span><strong>Credit / Debit Card</strong><small>Coming soon</small></span></label></div><button class="btn primary full large" type="submit">PLACE ORDER · ${StoreUtils.money(t.total)}</button></form></section><aside class="summary-card"><h2>ORDER REVIEW</h2><div class="checkout-items">${items.map(i=>`<div><img src="${i.image}" alt=""><span>${StoreUtils.escapeHTML(i.name)}<small>${i.size} · Qty ${i.quantity}</small></span><strong>${StoreUtils.money(i.price*i.quantity)}</strong></div>`).join('')}</div><div class="summary-lines"><div><span>Subtotal</span><span>${StoreUtils.money(t.subtotal)}</span></div><div><span>Discount</span><span>${t.discount?'-'+StoreUtils.money(t.discount):StoreUtils.money(0)}</span></div><div><span>Shipping</span><span>${t.shipping?StoreUtils.money(t.shipping):'FREE'}</span></div><div class="summary-total"><span>TOTAL</span><span>${StoreUtils.money(t.total)}</span></div></div></aside></div>`;const f=$('#checkoutForm');function setErr(name,msg){let input=f.elements[name],wrap=input.closest('label');wrap.querySelector('.field-error').textContent=msg;input.classList.toggle('invalid',!!msg)}function validate(){let ok=true,v=n=>f.elements[n].value.trim(),tests=[['fullName',v('fullName').length>=2?'':'Enter your full name.'],['mobile',/^[6-9][0-9]{9}$/.test(v('mobile'))?'':'Enter a valid 10-digit Indian mobile number.'],['email',/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v('email'))?'':'Enter a valid email address.'],['address1',v('address1').length>=5?'':'Enter your address.'],['city',v('city')?'':'Enter your city.'],['state',v('state')?'':'Enter your state.'],['pincode',/^[1-9][0-9]{5}$/.test(v('pincode'))?'':'Enter a valid 6-digit PIN code.']];tests.forEach(([n,m])=>{setErr(n,m);if(m)ok=false});return ok}f.onsubmit=e=>{e.preventDefault();if(!validate()){f.querySelector('.invalid')?.focus();return}let fd=Object.fromEntries(new FormData(f).entries());StoreStorage.set(StoreStorage.KEYS.customer,fd);let order={orderId:StoreUtils.orderId(),createdAt:new Date().toISOString(),status:'Confirmed',paymentMethod:'Cash on Delivery',customer:{fullName:fd.fullName,mobile:fd.mobile,email:fd.email},shippingAddress:{address1:fd.address1,address2:fd.address2,landmark:fd.landmark,city:fd.city,state:fd.state,pincode:fd.pincode,country:'India'},items,pricing:{subtotal:t.subtotal,discount:t.discount,shipping:t.shipping,total:t.total}},orders=StoreStorage.get(StoreStorage.KEYS.orders,[]);orders.unshift(order);StoreStorage.set(StoreStorage.KEYS.orders,orders);StoreStorage.set(StoreStorage.KEYS.lastOrder,order.orderId);if(buyNow)StoreStorage.remove(StoreStorage.KEYS.buyNow);else{StoreStorage.set(StoreStorage.KEYS.cart,[]);StoreStorage.remove(StoreStorage.KEYS.coupon)}location.href='order-success.html?id='+encodeURIComponent(order.orderId)}});</script></body></html>
