<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | NORTHROW</title><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div id="accountRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{let r=document.getElementById('accountRoot'),s=StoreStorage.get(StoreStorage.KEYS.customer,{})||{};r.innerHTML=`<div class="page-title-row"><h1>MY ACCOUNT</h1><span>LOCAL BROWSER PROFILE</span></div><div class="account-grid"><nav class="account-links"><a href="orders.html"><strong>My Orders</strong><span>View COD orders placed on this browser →</span></a><a href="wishlist.html"><strong>Wishlist</strong><span>View saved products →</span></a></nav><section class="saved-card"><h2>SAVED DETAILS</h2><p>Stored only in LocalStorage on this device.</p><form id="savedForm" class="form-grid"><label>Full Name<input name="fullName" value="${StoreUtils.escapeHTML(s.fullName||'')}"></label><label>Mobile<input name="mobile" value="${StoreUtils.escapeHTML(s.mobile||'')}"></label><label class="wide">Email<input name="email" value="${StoreUtils.escapeHTML(s.email||'')}"></label><label class="wide">Address Line 1<input name="address1" value="${StoreUtils.escapeHTML(s.address1||'')}"></label><label>City<input name="city" value="${StoreUtils.escapeHTML(s.city||'')}"></label><label>State<input name="state" value="${StoreUtils.escapeHTML(s.state||'')}"></label><label>PIN Code<input name="pincode" value="${StoreUtils.escapeHTML(s.pincode||'')}"></label><button class="btn primary wide">SAVE DETAILS</button></form></section></div>`;document.getElementById('savedForm').onsubmit=e=>{e.preventDefault();StoreStorage.set(StoreStorage.KEYS.customer,Object.fromEntries(new FormData(e.target).entries()));StoreApp.notify('Details saved on this browser')}});</script></body></html>
