<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>My Account | 3 STAR</title><link rel="stylesheet" href="css/bundle.css"></head><body><div id="siteHeader"></div><main class="page-shell"><div id="accountRoot"></div></main><div id="siteFooter"></div><script src="js/core.js"></script><script src="js/patch.js"></script><script>document.addEventListener('DOMContentLoaded',()=>{const r=document.getElementById('accountRoot'),s=StoreStorage.get(StoreStorage.KEYS.customer,{})||{};r.innerHTML=`<div class="page-title-row"><h1>My Account</h1></div><div class="account-grid"><nav class="account-links"><a href="orders.html"><strong>My Orders</strong><span>View orders placed on this browser →</span></a></nav><section class="saved-card"><h2>Saved Details</h2><form id="savedForm" class="form-grid"><label>Full Name<input name="fullName" value="${StoreUtils.escapeHTML(s.fullName||'')}"></label><label>Mobile<input name="mobile" value="${StoreUtils.escapeHTML(s.mobile||'')}"></label><label class="wide">Email<input name="email" value="${StoreUtils.escapeHTML(s.email||'')}"></label><label class="wide">Address<input name="address1" value="${StoreUtils.escapeHTML(s.address1||'')}"></label><label>City<input name="city" value="${StoreUtils.escapeHTML(s.city||'')}"></label><label>State<input name="state" value="${StoreUtils.escapeHTML(s.state||'')}"></label><label>PIN Code<input name="pincode" value="${StoreUtils.escapeHTML(s.pincode||'')}"></label><button class="btn primary wide">Save Details</button></form></section></div>`;document.getElementById('savedForm').onsubmit=e=>{e.preventDefault();StoreStorage.set(StoreStorage.KEYS.customer,Object.fromEntries(new FormData(e.target).entries()));StoreApp.notify('Details saved')}});</script></body></html>
